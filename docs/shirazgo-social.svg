<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">ShirazGo metro journey planner</title>
  <desc id="desc">A green and gold map-inspired preview with two metro lines and bilingual journey planning.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#082821"/>
      <stop offset="1" stop-color="#123f35"/>
    </linearGradient>
    <radialGradient id="glow" cx="75%" cy="35%" r="65%">
      <stop offset="0" stop-color="#4d9279" stop-opacity=".38"/>
      <stop offset="1" stop-color="#082821" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#03130f" flood-opacity=".5"/>
    </filter>
  </defs>
  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#glow)"/>
  <g opacity=".08" stroke="#c9ddd2" fill="none">
    <path d="M0 120C240 30 360 230 610 130S1010 20 1280 120"/>
    <path d="M0 500C260 390 390 580 650 470S1060 370 1280 470"/>
    <path d="M160 0C80 180 260 280 180 640"/>
    <path d="M1090 0C1010 170 1190 310 1080 640"/>
  </g>
  <g transform="translate(88 110)">
    <text x="0" y="86" fill="#fbf7ee" font-family="Segoe UI, Arial, sans-serif" font-size="92" font-weight="800">ShirazGo</text>
    <text x="4" y="140" fill="#a8c8b8" font-family="Segoe UI, Arial, sans-serif" font-size="28" letter-spacing="4">SHIRAZ METRO JOURNEY PLANNER</text>
    <text x="4" y="218" fill="#e7f0eb" font-family="Segoe UI, Arial, sans-serif" font-size="30">Plan Lines 1 and 2 in English or Persian.</text>
    <text x="4" y="262" fill="#c9ddd2" font-family="Segoe UI, Arial, sans-serif" font-size="24">Timetables · From–To matrix · RTL interface</text>
    <g transform="translate(0 326)">
      <rect width="278" height="72" rx="36" fill="#d49a37"/>
      <text x="139" y="47" text-anchor="middle" fill="#082821" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="700">Plan your journey</text>
    </g>
  </g>
  <g transform="translate(755 68)" filter="url(#shadow)">
    <rect width="430" height="504" rx="34" fill="#fbf7ee"/>
    <rect x="34" y="34" width="362" height="70" rx="18" fill="#e7f0eb"/>
    <circle cx="76" cy="69" r="15" fill="#d49a37"/>
    <text x="110" y="79" fill="#17302a" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="700">Shiraz Metro</text>
    <path d="M104 152V422" stroke="#d49a37" stroke-width="10" stroke-linecap="round"/>
    <path d="M104 286H314V420" stroke="#4b9bb8" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <g fill="#fbf7ee" stroke="#d49a37" stroke-width="7">
      <circle cx="104" cy="170" r="15"/><circle cx="104" cy="228" r="15"/><circle cx="104" cy="286" r="18"/>
      <circle cx="104" cy="344" r="15"/><circle cx="104" cy="402" r="15"/>
    </g>
    <g fill="#fbf7ee" stroke="#4b9bb8" stroke-width="7">
      <circle cx="174" cy="286" r="14"/><circle cx="244" cy="286" r="14"/><circle cx="314" cy="286" r="18"/>
      <circle cx="314" cy="354" r="14"/><circle cx="314" cy="420" r="14"/>
    </g>
    <g fill="#17302a" font-family="Segoe UI, Arial, sans-serif" font-size="18">
      <text x="137" y="177">Line 1</text>
      <text x="222" y="264">Line 2</text>
      <text x="137" y="410">Next train · 08 min</text>
    </g>
  </g>
</svg>
