name: Update Persian calendar

on:
  workflow_dispatch:
  schedule:
    - cron: "20 3 1 * *"

permissions:
  contents: write

jobs:
  generate-calendar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-calendar.txt
      - run: python scripts/generate_calendar.py
      - name: Commit updated calendar data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/calendar/
          git diff --cached --quiet || git commit -m "Update Persian calendar data"
          git push
